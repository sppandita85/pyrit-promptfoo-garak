# Postgres + pgvector for the banking RAG lab.
# Host port 5436 (5432/5433 are already used on this machine).
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: bankrag-lab-db
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: bankrag
    ports:
      - "5436:5432"
    volumes:
      - bankrag_lab_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bankrag"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Web UI for browsing the chunks table: http://localhost:5052 (no login, desktop mode).
  # The server is pre-registered; enter password "bank" on first connect.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bankrag-lab-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5052:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - db

volumes:
  bankrag_lab_data:
